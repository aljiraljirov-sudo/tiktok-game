<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flag Race</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efe6;--dim:#c3bbae;--acc:#ff8a2b;--glass:rgba(10,12,18,.62);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0d14;color:var(--ink);font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:calc(2.2% + 38px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#rule{width:min(92vw,640px);text-align:center;padding:9px 16px}
#rule{background:rgba(10,12,18,.23);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#holder{background:rgba(10,12,18,.17);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.l1{font-weight:700;font-size:clamp(19px,3.8vw,30px)}
.l2{font-weight:500;font-size:clamp(15px,2.9vw,22px);color:var(--dim);margin-top:1px}
.l2 b{color:var(--acc);font-weight:800}
#rule .l1,#rule .l2{transition:opacity .25s}#rule.sw .l1,#rule.sw .l2{opacity:0}
#holder{display:none;align-items:center;gap:12px;padding:8px 16px 8px 8px}
#holder.in{display:flex;animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-16px) scale(.94);opacity:0}to{transform:none;opacity:1}}
#avatar{width:46px;height:46px;border-radius:50%;background:#2a2f3c center/cover;display:grid;place-items:center;font-weight:800;font-size:22px;border:2px solid rgba(255,255,255,.7)}
#hflag{height:34px;width:auto;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.5),0 3px 8px rgba(0,0,0,.5)}
#hname{font-weight:800;font-size:clamp(20px,4vw,30px);line-height:1}
#hby{font-weight:500;font-size:clamp(14px,2.6vw,19px);color:var(--dim);margin-top:2px}
#toast{display:none;padding:2px 10px;font-weight:600;font-size:clamp(12px,2.3vw,17px);max-width:92vw;text-align:center;background:transparent;border:0;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.75)}
#toast.show{display:block;animation:drop .35s ease}
#dist{position:absolute;left:6%;bottom:calc(4.5% + 20px);font-weight:600;font-size:clamp(14px,2.6vw,19px);color:var(--dim);font-variant-numeric:tabular-nums}
#bar{position:absolute;left:6%;right:6%;bottom:4.5%;height:8px;border-radius:5px;background:rgba(255,255,255,.18)}
#fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ff5a1f,#ffb347)}
#mk{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,138,43,.55)}
#end{position:absolute;right:-5px;top:-7px;width:14px;height:22px;border:1px solid #fff;border-radius:2px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/7px 7px}
#fx{z-index:13;pointer-events:none;display:none}
#dot{position:fixed;left:8px;top:8px;width:9px;height:9px;border-radius:50%;background:#7a7f8c}
#demoBtn,#menuBtn,#panel,#menu{display:none}
#tb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:20;gap:6px;pointer-events:auto;display:flex;transition:opacity .4s}
#tb.away{opacity:0;pointer-events:none}
#demoBtn{display:block}
#tb button.on{background:var(--acc);color:#1a1006;border-color:transparent}
#menuBtn{display:block}
#tb button{background:var(--glass);color:var(--ink);border:1px solid var(--line);border-radius:8px;height:26px;padding:0 9px;font:700 13px 'Barlow Condensed',sans-serif;line-height:1;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#menuBtn{font-size:16px!important;padding:0 8px!important}
#panel,#menu{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 38px);max-height:calc(100% - 52px);overflow:auto;width:min(340px,calc(100vw - 20px));z-index:20;padding:12px;pointer-events:auto;font-size:17px}
#panel.open,#menu.open{display:block}
#menu{width:min(300px,calc(100vw - 16px));overflow:auto;z-index:20;padding:12px;pointer-events:auto;font-size:17px}
#menu label,#panel label{display:block;font-weight:600;color:var(--dim);margin:8px 0 3px;font-size:15px}
#menu input[type=text],#menu input[type=number],#panel input[type=text],#panel input[type=number]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:600 18px 'Barlow Condensed',sans-serif}
#menu .row,#panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#menu button,#panel button{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);font:700 17px 'Barlow Condensed',sans-serif;min-width:64px}
#menu button.go,#panel button.go{background:var(--acc);color:#1a1006;border-color:transparent}
#menu select{flex:1;min-width:0;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:#23242b;color:var(--ink);font:600 15px 'Barlow Condensed',sans-serif}#menu .row input{flex:1;min-width:0}
#menu .auto,#panel .auto{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600}
#carSw{gap:6px}#menu #carSw button{flex:0 0 30px;min-width:30px;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.35)}#menu #carSw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
#carTy button,#camPre button{flex:0 0 auto;min-width:0;padding:6px 10px;font-size:15px}#menu #camPre button.on{background:var(--acc);color:#1a1006;border-color:transparent}#menu #carTy button.on{background:var(--acc);color:#1a1006;border-color:transparent}
#menu summary{font-weight:700;margin-top:10px;color:var(--dim);cursor:pointer}#menu details input[type=range]{width:100%}
#carImg{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.02;pointer-events:none;z-index:-1}
#cdn{position:fixed;left:0;right:0;top:24%;text-align:center;font-weight:800;font-size:clamp(90px,26vw,240px);line-height:1;color:#fff;text-shadow:0 0 30px rgba(255,138,43,.85),0 6px 24px rgba(0,0,0,.6);opacity:0;pointer-events:none;z-index:5}
#cdn.pop{animation:cdpop .95s ease-out forwards}
@keyframes cdpop{0%{transform:scale(1.8);opacity:0}12%{opacity:1}78%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:0}}
@media (prefers-reduced-motion:reduce){#holder.in{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<img id="carImg" alt="">
<div id="hud">
  <div id="top">
    <div id="rule" class="glass"><div class="l1" id="ruleTitle">Write a country, send a gift</div><div class="l2" id="ruleTxt">Any gift puts your flag on the car</div></div>
    <div id="holder" class="glass"><div id="avatar"></div><img id="hflag" alt=""><div><div id="hname"></div><div id="hby"></div></div></div>
    <div id="toast" class="glass"></div>
  </div>
  <div id="dist"></div>
  <div id="bar"><div id="fill"></div><div id="mk"></div><div id="end"></div></div>
</div>
<div id="cdn"></div>
<div id="dot"></div>
<canvas id="fx"></canvas>

<div id="tb"><button id="demoBtn">Demo</button><button id="menuBtn" aria-label="Menu">&#9776;</button></div>
<div id="menu" class="glass">
  <label>Имя пользователя TikTok</label><input type="text" id="mu" placeholder="@username" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="row"><button class="go" id="mConnect">Подключить</button></div>
  <label>Длина гонки (минуты)</label><input type="number" id="dm" min="0.5" max="120" step="0.5" value="1">
  <div class="row"><button class="go" id="mDur">Применить</button></div>
  <div class="auto"><input type="checkbox" id="snd" checked><label for="snd" style="margin:0;color:var(--ink)">Звук машины</label></div>
  <label>Громкость</label><input type="range" id="vol" min="0" max="100" value="60" style="width:100%">
  <label>Песни для стран</label>
  <div class="row"><select id="sgC"></select></div>
  <div class="row"><button id="sgUp">Загрузить песню</button><button id="sgTest">&#9654;</button><button id="sgDel">Удалить</button></div>
  <input type="file" id="sgFile" accept="audio/*" hidden>
  <div id="sgList" style="font-size:14px;color:var(--dim);margin-top:6px;line-height:1.35"></div>
  <label>Вид камеры</label>
  <div class="row" id="camPre"></div>
  <label>Высота камеры <span id="chv"></span></label><input type="range" id="camH" min="-10" max="50" value="0" style="width:100%">
  <label>Наклон камеры <span id="ctv"></span></label><input type="range" id="camT" min="-20" max="60" value="18" style="width:100%">
  <label>Расстояние камеры <span id="cdv"></span></label><input type="range" id="camD" min="80" max="180" value="80" style="width:100%">
  <label>Цвет машины</label>
  <div class="row" id="carSw"></div>
  <label>Тип машины</label>
  <div class="row" id="carTy"></div>
  <div class="row"><button id="carUp">Загрузить картинку / GIF</button><button id="carMine">Моя картинка</button></div>
  <input type="file" id="carFile" accept="image/*" hidden>
  <label>Размер машины <span id="szv"></span></label><input type="range" id="carSz" min="30" max="500" value="100" style="width:100%">
  <details id="fine"><summary>Тонкая настройка картинки</summary>
    <label>Высота <span id="oyv"></span></label><input type="range" id="carOy" min="-150" max="150" value="0">
    <label>Влево / вправо <span id="oxv"></span></label><input type="range" id="carOx" min="-150" max="150" value="0">
    <label>Высота выхлопа <span id="exyv"></span></label><input type="range" id="carExy" min="-80" max="80" value="0">
    <label>Расстояние между выхлопами <span id="exsv"></span></label><input type="range" id="carExs" min="0" max="200" value="100">
    <label>Высота флага <span id="flyv"></span></label><input type="range" id="carFly" min="-100" max="100" value="0">
    <label>Ширина колёс <span id="wwv"></span></label><input type="range" id="carWw" min="0" max="200" value="100">
    <label>Высота колёс <span id="whv"></span></label><input type="range" id="carWh" min="20" max="200" value="100">
    <div class="row"><button id="carAuto">Автоподгонка</button></div>
  </details>
  <label>Эффекты подарков (каждый такой подарок переключает по кругу, можно несколько названий через запятую)</label>
  <label>Подарок для смены цвета</label><input type="text" id="gfColN" placeholder="напр. Rose" autocomplete="off" spellcheck="false">
  <label>Подарок для смены машины</label><input type="text" id="gfCarN" placeholder="напр. Heart" autocomplete="off" spellcheck="false">
  <label>Подарок для смены дороги</label><input type="text" id="gfThN" placeholder="напр. Galaxy" autocomplete="off" spellcheck="false">
  <div class="row"><button class="go" id="gfSave">Сохранить</button></div>
  <label>Победы за подарки: от X до Y монет = +N побед (пустое «До» = без верхней границы)</label>
  <div id="tierList"></div>
  <div class="row"><input type="number" id="tMin" placeholder="Монет от" min="1"><input type="number" id="tMax" placeholder="До" min="1"><input type="number" id="tWin" placeholder="+ побед" min="1"></div>
  <div class="row"><button class="go" id="tAdd">Добавить уровень</button></div>
  <div class="row"><button id="bResetAll">Перезапустить всё</button></div>
</div>
<div id="panel" class="glass">
  <label>Viewer name</label><input type="text" id="pn" value="Nor">
  <label>Chat message (country name or flag emoji)</label><input type="text" id="pc" list="cl" value="Armenia"><datalist id="cl"></datalist>
  <label>Gift (coins)</label><input type="number" id="pg" value="20" min="0">
  <label>Gift name (optional)</label><input type="text" id="pgn" placeholder="Rose" autocomplete="off">
  <label>Likes</label><input type="number" id="pl" value="100" min="0">
  <div class="row" id="chips"></div>
  <div class="row"><button class="go" id="bBoth">Chat + gift</button><button id="bChat">Chat only</button><button id="bGift">Gift only</button><button id="bLike">Likes</button></div>
  <div class="auto"><input type="checkbox" id="pa"><label for="pa" style="margin:0;color:var(--ink)">Auto viewers (fake chat and gifts)</label></div>
  <div class="row"><button id="bRestart">Restart race</button></div>
</div>

<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const WS_URL = 'ws://10.158.147.136:3000';   // address of server.js (used only when this file is opened directly, not through http://...:3000/)
const FILE = location.protocol === 'file:' || location.protocol === 'content:' || !location.host;
const DEMO = qs.has('demo') || (FILE && !WS_URL);
const TEST = qs.has('test');
if (DEMO || TEST) document.body.classList.add('tools');
if (qs.has('menu')) document.body.classList.add('menu');

/* ================= countries ================= */
const CODES = `AD AE AF AG AL AM AO AR AT AU AZ BA BB BD BE BF BG BH BI BJ BN BO BR BS BT BW BY BZ CA CD CF CG CH CI CL CM CN CO CR CU CV CY CZ DE DJ DK DM DO DZ EC EE EG ER ES ET FI FJ FM FR GA GB GD GE GH GM GN GQ GR GT GW GY HK HN HR HT HU ID IE IL IN IQ IR IS IT JM JO JP KE KG KH KI KM KN KP KR KW KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH MK ML MM MN MR MT MU MV MW MX MY MZ NA NE NG NI NL NO NP NR NZ OM PA PE PG PH PK PL PS PT PW PY QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST SV SY SZ TD TG TH TJ TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VN VU WS XK YE ZA ZM ZW`.split(/\s+/);
const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
const byName = new Map(), enName = {};
(function(){
  let dn = []; try { dn = ['en', 'ru', 'hy'].map(l => new Intl.DisplayNames([l], { type: 'region' })); } catch(e){}
  for (const c of CODES) {
    dn.forEach((d, i) => { let n; try { n = d.of(c); } catch(e){} if (!n || n === c) return; if (i === 0) enName[c] = n; byName.set(norm(n), c); });
    if (!enName[c]) enName[c] = c;
  }
  const A = { usa:'US', america:'US', uk:'GB', england:'GB', britain:'GB', uae:'AE', holland:'NL', turkiye:'TR', korea:'KR', czechia:'CZ', 'сша':'US', 'россия':'RU', 'армения':'AM', 'հայաստան':'AM' };
  for (const k in A) byName.set(norm(k), A[k]);
})();
function findCountry(text) {
  const f = text.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u);
  if (f) { const c = [...f[0]].map(ch => String.fromCharCode(ch.codePointAt(0) - 0x1F1E6 + 65)).join(''); if (enName[c]) return c; }
  const w = norm(text).split(' ').filter(Boolean);
  for (let n = 3; n >= 1; n--) for (let i = 0; i + n <= w.length; i++) { const c = byName.get(w.slice(i, i + n).join(' ')); if (c) return c; }
  return null;
}
const flagUrl = c => `https://flagcdn.com/w320/${c.toLowerCase()}.png`;
const imgs = {};
function flagImg(c){ if (!imgs[c]) { const i = new Image(); i.src = flagUrl(c); imgs[c] = i; if (i.decode) i.decode().catch(() => {}); } return imgs[c]; }

/* ================= local demo engine (same rules as server.js) ================= */
const Eng = {
  dur: 25, race: null, users: new Map(),
  start(){ this.newRace(); setInterval(() => this.tick(), 100); },
  newRace(){ this.race = { status:'racing', startedAt:Date.now() + 3000, progress:0, code:null, country:null, price:0, owner:null, avatar:null, gb:{}, pts:{} }; },
  tot(c){ const r = this.race; return (r.gb[c] || 0) + (r.pts[c] || 0); },
  user(id){ if (!this.users.has(id)) this.users.set(id, { code:null, codeAt:0, gift:0, giftAt:0, gn:'', name:id, likes:0 }); return this.users.get(id); },
  chat(id, text){ const c = findCountry(text); if (!c) return; const u = this.user(id); u.code = c; u.codeAt = Date.now(); this.apply(u); },
  gift(id, v, gn){ if (v <= 0) return; const u = this.user(id); u.gift = v; u.gn = gn || ''; u.giftAt = Date.now();
    if (!u.code || Date.now() - u.codeAt > 300000) handle({ type:'hint', user:id, text:'write a country name in chat to place your flag' });
    this.apply(u); },
  apply(u){
    const n = Date.now(); if (!u.code || n - u.codeAt > 300000 || !u.gift || n - u.giftAt > 60000) return;
    const v = u.gift, gn = u.gn; u.gift = 0; u.gn = ''; const r = this.race; if (r.status !== 'racing') return;
    r.gb[u.code] = (r.gb[u.code] || 0) + v; const t = this.tot(u.code);   // gifts for the same country ADD UP during the round
    if (t > r.price) { Object.assign(r, { code:u.code, country:enName[u.code], price:t, owner:u.name });
      handle({ type:'flag', code:u.code, country:r.country, user:u.name, price:t }); }
    else handle({ type:'rejected', user:u.name, need:r.price + 1 - t, v });
    handle({ type:'gift', user:u.name, code:u.code, v, giftName:gn });   // gift effects + win tiers (server mode: the server must send this message too)
  },
  like(id, n){                                       // every 100 likes = +5 points for the country the viewer wrote
    const u = this.user(id), r = this.race; u.likes += n;
    if (!u.code || Date.now() - u.codeAt > 300000 || r.status !== 'racing') return;
    const k = Math.floor(u.likes / 100); if (!k) return; u.likes -= k * 100;
    const c = u.code, add = 5 * k; r.pts[c] = (r.pts[c] || 0) + add; const t = this.tot(c);
    handle({ type:'points', code:c, country:enName[c], user:u.name, add });
    if (c === r.code) r.price = t;
    else if (t > r.price) { Object.assign(r, { code:c, country:enName[c], price:t, owner:u.name }); handle({ type:'flag', code:c, country:r.country, user:u.name, price:t }); }
  },
  tick(){
    const r = this.race;
    if (r.status === 'racing') {
      const t = (Date.now() - r.startedAt) / 1000, R = 2, te = t <= 0 ? 0 : t < R ? t * t / (2 * R) : t - R / 2;   // 3 s countdown, then accelerate from 0
      r.progress = Math.min(1, te / Math.max(1, this.dur - R / 2));
      if (r.progress >= 1) { r.status = 'finished';
        handle({ type:'finish', code:r.code, country:r.country, user:r.owner, price:r.price });
        setTimeout(() => { this.newRace(); handle({ type:'reset' }); }, 8000); }
    }
    handle({ type:'state', cd:Math.max(0, (r.startedAt - Date.now()) / 1000), status:r.status, progress:r.progress, dur:this.dur, code:r.code, country:r.country, price:r.price, owner:r.owner, tot:Object.fromEntries([...new Set([...Object.keys(r.gb), ...Object.keys(r.pts)])].map(c => [c, this.tot(c)])) });
  },
  restart(){ this.newRace(); handle({ type:'reset' }); }
};

/* ================= network ================= */
let ws;
const store = {
  q:{}, t:0,
  get(k){ if (k in this.q) return this.q[k]; try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ this.q[k] = v; if (!this.t) this.t = setTimeout(() => this.flush(), 400); },   // writes are batched (no freeze on every gift / slider move)
  flush(){ clearTimeout(this.t); this.t = 0; const q = this.q; this.q = {}; for (const k in q) { try { localStorage.setItem(k, q[k]); } catch(e){} } }
};
addEventListener('pagehide', () => store.flush()); addEventListener('beforeunload', () => store.flush()); document.addEventListener('visibilitychange', () => { if (document.hidden) store.flush(); });
const cleanUser = v => (v || '').trim().replace(/^@+/, '');
const curUser = () => cleanUser(qs.get('user') || store.get('tt_user'));
function connect(){
  ws = new WebSocket(FILE ? WS_URL : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => { $('dot').style.background = '#ffb347'; const u = curUser(); if (u) ws.send(JSON.stringify({ type:'connect', username:u })); };
  ws.onclose = () => { $('dot').style.background = '#e63946'; setTimeout(connect, 1500); };
  ws.onmessage = e => handle(JSON.parse(e.data));
}
function act(name, text, coins, likes, gn){
  if (DEMO) { if (text) Eng.chat(name, text); if (coins > 0) Eng.gift(name, coins, gn); if (likes > 0) Eng.like(name, likes); }
  else if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type:'test', user:name, text:text || '', gift:coins || 0, giftName:gn || '', likes:likes || 0 }));
}

/* ================= game view state ================= */
let L = 1800; const SPEED = 50;    // race length in metres follows the duration so the road speed stays the same
const G = { p:0, status:'racing', dur:45, code:null, country:null, price:0, owner:null, avatar:null, tot:{}, ord:[] };   // tot = points of every country this round, ord = stable order they first appeared in
function setTot(t){ G.tot = t; for (const c in t) if (t[c] > 0 && !G.ord.includes(c)) G.ord.push(c); }
let curDur = 0;

<script>
/* swipe up -> browser fullscreen (address bar, status bar, nav bar hide). The game keeps EXACTLY its old size and place, the freed top/bottom area stays black. */
(() => {
  const FS_TOP = 33;                                   // px from the top of the screen where the game sits in fullscreen (~ status-bar height); change it if the picture should sit a bit higher/lower
  const dW = Object.getOwnPropertyDescriptor(window, 'innerWidth'), dH = Object.getOwnPropertyDescriptor(window, 'innerHeight');
  if (!dW || !dH || !dW.get || !dH.get) return;
  let FSV = null;                                      // frozen game size while fullscreen is on
  const rw = () => dW.get.call(window), rh = () => dH.get.call(window);
  try {
    Object.defineProperty(window, 'innerWidth', { configurable:true, get: () => FSV ? FSV.w : rw() });
    Object.defineProperty(window, 'innerHeight', { configurable:true, get: () => FSV ? FSV.h : rh() });
  } catch (e) { return; }
  const root = document.documentElement, body = document.body, fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const style = document.createElement('style'); style.textContent = 'html.fsg{background:#000!important}html.fsg body{position:absolute!important;overflow:hidden!important;transform:translateZ(0)}';
  document.head.appendChild(style);
  const kick = () => { dispatchEvent(new Event('resize')); setTimeout(() => dispatchEvent(new Event('resize')), 120); };
  function apply(){
    if (fsEl()) {
      if (!FSV) return;
      root.classList.add('fsg');
      const top = Math.max(0, Math.min(FS_TOP, rh() - FSV.h));
      body.style.width = FSV.w + 'px'; body.style.height = FSV.h + 'px'; body.style.left = Math.max(0, (rw() - FSV.w) / 2) + 'px'; body.style.top = top + 'px';
    } else {
      FSV = null; root.classList.remove('fsg'); body.style.width = body.style.height = body.style.left = body.style.top = '';
    }
    kick();
  }
  document.addEventListener('fullscreenchange', apply); document.addEventListener('webkitfullscreenchange', apply);
  function enter(){
    if (fsEl() || FSV) return;
    const rq = root.requestFullscreen || root.webkitRequestFullscreen; if (!rq) return;
    FSV = { w:rw(), h:rh() };
    let pr; try { pr = rq.call(root, { navigationUI:'hide' }); } catch (e) { FSV = null; return; }
    if (pr && pr.catch) pr.catch(() => { if (!fsEl()) FSV = null; });
  }
  let t0 = null;
  addEventListener('touchstart', e => { t0 = e.touches.length === 1 ? { x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now() } : null; }, { passive:true });
  addEventListener('touchend', e => {
    if (!t0) return; const c = e.changedTouches[0], dx = c.clientX - t0.x, dy = c.clientY - t0.y, dt = Date.now() - t0.t; t0 = null;
    if (dy < -70 && Math.abs(dx) < Math.abs(dy) * .7 && dt < 800) enter();   // swipe up
  }, { passive:true });
})();
</script>
